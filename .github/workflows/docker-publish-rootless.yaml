name: Docker publish rootless

on:
  workflow_dispatch:
  schedule:
    - cron: '00 0 * * *'
  # No path filters here on purpose: GitHub also applies path filters to tag
  # pushes, and a tag pushed onto a commit that is already on the remote has no
  # changed files, so filters can silently suppress the publish run. The `test`
  # gate below keeps unfiltered runs cheap.
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

# A nightly run and a tag/main push can race for the same image tags, so all
# publishing events share one concurrency group and cancel each other. Pull
# request runs get their own group so they never cancel a real publish.
concurrency:
  group: docker-publish-rootless-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'publish' }}
  cancel-in-progress: true

permissions:
  contents: read        # Access to repository contents
  packages: write       # Write access for pushing to GHCR
  id-token: write       # Required for OIDC authentication (if used)
  attestations: write   # Required for signing and attestation (if needed)

env:
  # Fork policy: publish only to this fork's own GHCR namespace. Upstream
  # registries (Docker Hub, ghcr.io/sysadminsmedia/*) are never touched.
  GHCR_REPO: ghcr.io/${{ github.repository }}
  DEVCACHE_REPO: ghcr.io/${{ github.repository_owner }}/homebox-devcache

jobs:
  test:
    name: Backend + frontend gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c
        with:
          go-version: "1.27"
          cache-dependency-path: backend/go.mod

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Enable Debug Logs
        run: echo "##[debug]Enabling debug logging"
        env:
          ACTIONS_RUNNER_DEBUG: true
          ACTIONS_STEP_DEBUG: true

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          branch=${{ github.event.pull_request.number || github.ref_name }}
          echo "BRANCH=${branch//\//-}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: |
            name=${{ env.GHCR_REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=schedule,pattern=nightly
          flavor: |
            suffix=-rootless,onlatest=true

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The ghcr.io/antebudimir/homebox package was created by a PAT push,
          # so it is not linked to this repository for GITHUB_TOKEN writes.
          # Use the same PAT that publish-image.yaml uses until the package's
          # "Manage Actions access" grants this repository write access.
          password: ${{ secrets.CR_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: . # Explicitly specify the build context
          file: ./Dockerfile.rootless # Explicitly specify the Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.GHCR_REPO }}",push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          cache-from: type=registry,ref=${{ env.DEVCACHE_REPO }}:${{ env.PLATFORM_PAIR }}-${{ env.BRANCH }}-rootless
          cache-to: type=registry,ref=${{ env.DEVCACHE_REPO }}:${{ env.PLATFORM_PAIR }}-${{ env.BRANCH }}-rootless,mode=max,ignore-error=true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Attest platform-specific images
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
                              
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    needs:
      - build

    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # See the build job: the package is not linked to this repo for
          # GITHUB_TOKEN writes, so use the PAT that created it.
          password: ${{ secrets.CR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: |
            name=${{ env.GHCR_REPO }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=schedule,pattern=nightly
          flavor: |
            suffix=-rootless,onlatest=true

      - name: Create manifest list and push GHCR
        id: push-ghcr
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_REPO }}@sha256:%s ' *)
          tag=$(jq -r --arg repo "${{ env.GHCR_REPO }}" \
            '[.tags[] | select(ascii_downcase | startswith(($repo | ascii_downcase) + ":"))][0] // ""' \
            <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ -z "$tag" ]; then
            echo "No ${{ env.GHCR_REPO }} tag found in DOCKER_METADATA_OUTPUT_JSON:"
            echo "$DOCKER_METADATA_OUTPUT_JSON"
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
          if [ -z "$digest" ]; then
            echo "Could not resolve a manifest digest for $tag"
            exit 1
          fi
          echo "Attesting $tag@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest GHCR images
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.push-ghcr.outputs.digest }}
          push-to-registry: true